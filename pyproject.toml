[project]
name = "azure-table-storage"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.13"
dependencies = [
    "azure-data-tables>=12.5.0",
    "keboola-component>=1.9.0",
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "keboola.datadirtest>=2.2.0",
    "pytest>=9.0.2",
    "ruff>=0.15.2",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]
